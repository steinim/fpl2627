name: kampprogram

# Genererer kampprogramblokka i context/04 fra fpl-data.
# Committer bare når en kamp, et klokkeslett, en deadline eller troppen faktisk
# har endret seg. Ved strukturavvik (BGW, DGW, utsatt kamp, foreløpig klokkeslett)
# committes advarselen i 04, og jobben feiler — GitHub sender da e-post.

on:
  schedule:
    - cron: "47 5 * * *"    # 05:47 UTC daglig
    - cron: "47 17 * * *"   # 17:47 UTC daglig
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kampprogram
  cancel-in-progress: false

jobs:
  generer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generer kampprogram
        run: python3 scripts/gen_kampprogram.py

      - name: Commit hvis endret
        run: |
          if git diff --quiet -- context/04-kampprogram-og-endringslogg.md; then
            echo "Ingen endring i kampprogrammet."
            exit 0
          fi
          git config user.name  "kampprogram-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add context/04-kampprogram-og-endringslogg.md
          git commit -m "kampprogram: oppdatert fra fpl-data"
          git push

      - name: Strukturkontroll
        run: python3 scripts/gen_kampprogram.py --check
